name: MCP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run smoke
      - run: npm run audit:public
      - run: npm pack --dry-run
